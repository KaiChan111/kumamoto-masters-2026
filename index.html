async function loadDate(date){
 currentDate=date;storageKey='kumamoto-'+date+'-favorites';
 try{favorites=new Set(JSON.parse(localStorage.getItem(storageKey)||'[]'))}catch(e){favorites=new Set()}
 el('syncinfo').textContent='正在讀取 '+date+' 賽程…';
 try{
  const response=await fetch('data/'+date+'.json?t='+Date.now(),{cache:'no-store'});
  if(!response.ok)throw Error('尚未取得此日期的資料');
  const data=await response.json();if(!Array.isArray(data)||data.length===0)throw Error('賽程尚未公布');
  matches=data;el('syncinfo').textContent=date+'｜已載入 '+data.length+' 場（時間與場地以 BWF 現場公告為準）';
 }catch(e){
  matches=[];el('syncinfo').textContent=date+'｜'+e.message+'。可改選 11/11 查看已保存的官方賽程。';
 }
 render();
}

el('refresh').addEventListener('click',()=>loadDate(currentDate));
